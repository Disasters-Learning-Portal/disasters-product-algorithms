# Lean DPS-worker conda env for disasters-product-algorithms.
#
# Shared by every dps/<sensor>/build-env.sh via ../environment.yml.
# Derived from dev-conda-deps.txt -- NOT image/environment.yml, which is the
# heavy Pangeo hub env (code-server, jupyter, virtualizarr, ...) inappropriate
# for a DPS worker.
#
# GDAL / rasterio / geopandas / pyproj MUST come from conda, never pip, so the
# Python bindings match the system libgdal (see CLAUDE.md "Critical Constraints").
#
# The repo itself (which provides the process_* console scripts) is installed by
# build-env.sh with `pip install <repo_root>` after this env is created, so it is
# NOT listed here.
#
# The env name below is the single source of truth: every run.sh does
# `conda run --name disasters_dps`. Keep them in sync.
name: disasters_dps
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- Geospatial stack (conda only) ---
  - gdal
  # Sentinel-2 bands ship as JPEG2000 (.jp2). conda-forge GDAL 3.9+ moved the
  # OpenJPEG JP2 driver into a SEPARATE plugin package that a bare `gdal` install
  # does NOT pull in -- without it every S2 band read fails with
  # "gdal_JP2OpenJPEG.so is not available" and process_sentinel2 produces ZERO
  # products (empty-success job: downloads + unzips fine, then can't open a
  # single .jp2 band). The hub image gets JP2 for free from the MAAP base; this
  # lean DPS worker env must pin the plugin explicitly. The version floats to
  # match whatever `gdal`/`libgdal-core` conda resolves (plugin ABI is pinned to
  # the core GDAL build, so do NOT hard-pin a version here).
  - libgdal-jp2openjpeg
  # Same plugin-split story for Black Marble: VIIRS VNP46A2 granules ship as HDF5
  # (.h5), and the HDF5 driver is ALSO a separate plugin package. Without it,
  # upstream blackmarble's convert_to_tiff() dies on the first granule with
  # "not recognized as being in a supported file format. It could have been
  # recognized by driver HDF5, but plugin gdal_HDF5.so is not available"
  # -- after a successful Earthdata download, so the job looks healthy until it
  # permanentFails. Version floats to match the resolved libgdal-core (plugin ABI
  # is pinned to the core GDAL build); do NOT hard-pin.
  - libgdal-hdf5
  # VERSION FLOORS: the >= floors below are NOT our requirements -- they mirror the
  # floors declared by the upstream `blackmarble` package (pip-installed at the bottom
  # of this file). pip only reinstalls a dependency it considers UNSATISFIED, so pinning
  # the floors here guarantees conda's builds already satisfy blackmarble and pip never
  # swaps a conda geo package for a PyPI wheel -- which would break the GDAL/rasterio
  # dylib match (CLAUDE.md "Critical Constraints": the geo stack MUST come from conda).
  # If `conda list -n disasters_dps` ever shows one of these on the `pypi` channel,
  # raise its floor here. Keep in sync with veda-black-marble's pyproject.toml.
  - rasterio>=1.4.3
  - rio-cogeo
  - geopandas>=1.1.1
  # shapely is pulled in transitively by geopandas, but blackmarble declares its own
  # floor -- pin it explicitly so pip can't decide the transitive build is too old.
  - shapely>=2.1.0
  - pyproj
  # --- Numerical / image processing ---
  - numpy>=2
  - scipy>=1.15.3
  - pillow
  - lxml
  # matplotlib-base (headless, no Qt) for the save_png quicklook step in run.sh, and for
  # blackmarble's plotting (matplotlib-base carries `matplotlib` dist metadata, so it
  # satisfies blackmarble's matplotlib>=3.10.3 without dragging in Qt).
  - matplotlib-base>=3.10.3
  # --- HTTP / AWS ---
  - requests
  - boto3>=1.38
  - botocore
  # --- Progress / utilities ---
  - tqdm>=4.67.1
  - psutil
  - fsspec
  - s3fs
  # --- Sentinel-2 STAC pipeline (src/sentinel2/sentinel2_stac_functions.py) ---
  # pystac-client is a hard module-level import -- without it
  # process_sentinel2_stac fails at import, not at first use.
  # pyspectral backs the L1C Rayleigh correction, which RAISES rather
  # than silently returning an uncorrected product when it is missing.
  # It ALSO needs RSR + LUT data files that Rayleigh() would otherwise
  # try to download at run time -- fatal on a DPS worker. dps/Dockerfile
  # bakes them in and gates the build on tools/pyspectral_selfcheck.py.
  - pystac-client>=0.9.0
  - pyspectral>=0.14.3
  # --- Archive tools ---
  # p7zip provides the `7z` binary that process_sentinel2 shells out to
  # (`7z x <scene>.SAFE.zip`, process_sentinel2.py) to extract Sentinel-2 .SAFE
  # archives. Without it the DPS job downloads scenes fine but fails to unzip
  # ("sh: 7z: not found") -> "NO SCENES MATCHED". Same pin as the hub image
  # (image/environment.yml).
  - p7zip==16.02
  # --- VEDA Black Marble (dps/blackmarble/run.sh runs the `blackmarble` CLI) ---
  # duckdb backs blackmarble's `--osm-source layercake` road download. From conda (not
  # pip) so it links against the same runtime as the rest of the stack; the floor
  # mirrors blackmarble's own declared minimum.
  - duckdb>=1.0.0
  # --- pip (build-env.sh uses it to install the repo) ---
  - pip
  - pip:
    # maap-py: lets a run.sh pull data-provider credentials from MAAP's encrypted
    # secret store at runtime (maap.secrets.get_secret via dps/_get_secret.py) so
    # they never pass through the DPS job's parameters or log. Used by the
    # Sentinel-2 job for Copernicus COP_USER/COP_PASS. pip-only (not on conda-forge).
    # v5.1.0 is the OGC-compliant client (MAAP guidance 2026-07-21: "use maap-py
    # 5.1.0 for OGC"); the DPS worker image is plain miniforge (NOT the MAAP base),
    # so unlike the hub image it does NOT inherit maap-py and must pin it here.
    # The v5 "breaking" changes are in the LEGACY register path we don't use;
    # `from maap.maap import MAAP` + `MAAP().secrets.get_secret()` are unchanged in
    # 5.1.0 (verified against the 5.1.0 source), so _get_secret.py needs no change.
    - maap-py==5.1.0
    # VEDA Black Marble -- the UPSTREAM package, installed straight from its own repo.
    # It is deliberately NOT vendored into this repo and NOT in [project.dependencies] /
    # dev-conda-deps.txt / image/environment.yml: Black Marble is maintained by
    # NASA-IMPACT, and keeping a local copy would put Disasters on the hook for it.
    # Installing it here scopes it (and its pip-only deps -- earthaccess, osmnx,
    # pystac-client, typer, obstore, which pip resolves automatically) to the DPS worker,
    # so the hub image / CI / base install never carry them.
    #
    # Pinned to a COMMIT SHA because upstream has no tagged release yet. Once NASA-IMPACT
    # cuts one, switch to `@vX.Y.Z` (or a plain `blackmarble==X.Y.Z` if it reaches
    # PyPI/conda) -- a one-line change.
    # A VCS URL is required, NOT a bare `blackmarble` name: that name on PyPI belongs to
    # an unrelated World Bank package.
    - git+https://github.com/NASA-IMPACT/veda-black-marble@20e7d782a6c826d19db73e35d501a17a25609e56
