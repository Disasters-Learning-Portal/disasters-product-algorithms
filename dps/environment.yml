# Lean DPS-worker conda env for disasters-product-algorithms.
#
# Shared by every dps/<sensor>/build-env.sh via ../environment.yml.
# Derived from dev-conda-deps.txt -- NOT image/environment.yml, which is the
# heavy Pangeo hub env (code-server, jupyter, virtualizarr, ...) inappropriate
# for a DPS worker.
#
# GDAL / rasterio / geopandas / pyproj MUST come from conda, never pip, so the
# Python bindings match the system libgdal (see CLAUDE.md "Critical Constraints").
#
# The repo itself (which provides the process_* console scripts) is installed by
# build-env.sh with `pip install <repo_root>` after this env is created, so it is
# NOT listed here.
#
# The env name below is the single source of truth: every run.sh does
# `conda run --name disasters_dps`. Keep them in sync.
name: disasters_dps
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- Geospatial stack (conda only) ---
  - gdal
  # Sentinel-2 bands ship as JPEG2000 (.jp2). conda-forge GDAL 3.9+ moved the
  # OpenJPEG JP2 driver into a SEPARATE plugin package that a bare `gdal` install
  # does NOT pull in -- without it every S2 band read fails with
  # "gdal_JP2OpenJPEG.so is not available" and process_sentinel2 produces ZERO
  # products (empty-success job: downloads + unzips fine, then can't open a
  # single .jp2 band). The hub image gets JP2 for free from the MAAP base; this
  # lean DPS worker env must pin the plugin explicitly. The version floats to
  # match whatever `gdal`/`libgdal-core` conda resolves (plugin ABI is pinned to
  # the core GDAL build, so do NOT hard-pin a version here).
  - libgdal-jp2openjpeg
  - rasterio
  - rio-cogeo
  - geopandas
  - pyproj
  # --- Numerical / image processing ---
  - numpy
  - scipy
  - pillow
  - lxml
  # matplotlib-base (headless, no Qt) for the save_png quicklook step in run.sh
  - matplotlib-base
  # --- HTTP / AWS ---
  - requests
  - boto3
  - botocore
  # --- Progress / utilities ---
  - tqdm
  - psutil
  - fsspec
  - s3fs
  # --- Archive tools ---
  # p7zip provides the `7z` binary that process_sentinel2 shells out to
  # (`7z x <scene>.SAFE.zip`, process_sentinel2.py) to extract Sentinel-2 .SAFE
  # archives. Without it the DPS job downloads scenes fine but fails to unzip
  # ("sh: 7z: not found") -> "NO SCENES MATCHED". Same pin as the hub image
  # (image/environment.yml).
  - p7zip==16.02
  # --- VEDA Black Marble (dps/blackmarble/run.sh runs `python -m blackmarble.cli`) ---
  # blackmarble is a VENDORED package (src/blackmarble/) with a heavy, divergent
  # dependency stack that is DELIBERATELY isolated to this DPS worker env -- it is
  # NOT in [project.dependencies], dev-conda-deps.txt, or image/environment.yml, so
  # the hub image / CI / base install never carry it. The geo stack blackmarble needs
  # (gdal, rasterio, geopandas, pyproj, numpy, scipy, matplotlib-base) is already
  # above; only these extras are new. duckdb is conda (only used by the layercake OSM
  # backend); the rest are pip (mirrors the upstream fork's environment.yml split).
  - duckdb
  # --- pip (build-env.sh uses it to install the repo) ---
  - pip
  - pip:
    # maap-py: lets a run.sh pull data-provider credentials from MAAP's encrypted
    # secret store at runtime (maap.secrets.get_secret via dps/_get_secret.py) so
    # they never pass through the DPS job's parameters or log. Used by the
    # Sentinel-2 job for Copernicus COP_USER/COP_PASS. pip-only (not on conda-forge).
    # v5.1.0 is the OGC-compliant client (MAAP guidance 2026-07-21: "use maap-py
    # 5.1.0 for OGC"); the DPS worker image is plain miniforge (NOT the MAAP base),
    # so unlike the hub image it does NOT inherit maap-py and must pin it here.
    # The v5 "breaking" changes are in the LEGACY register path we don't use;
    # `from maap.maap import MAAP` + `MAAP().secrets.get_secret()` are unchanged in
    # 5.1.0 (verified against the 5.1.0 source), so _get_secret.py needs no change.
    - maap-py==5.1.0
    # VEDA Black Marble pip-only deps (pip, not conda, mirrors the upstream fork's
    # environment.yml). These are the ONLY blackmarble deps not already satisfied by
    # the conda geo stack above; kept here (DPS worker env) so they never reach the
    # hub image / CI / base install. pinned to the fork's floors.
    - earthaccess>=0.16.0
    - osmnx>=2.0.2
    - pystac-client>=0.9.0
    - typer>=0.15.3
    - obstore>=0.8.2
