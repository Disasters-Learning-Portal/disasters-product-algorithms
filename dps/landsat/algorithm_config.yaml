algorithm_name: landsat-8-9
# git ref DPS clones (branch or tag). 'dev' tracks active development; pin a tag
# (e.g. v0.10.0) for reproducible production runs.
algorithm_version: dev
algorithm_description: >-
  Process Landsat 8/9 Collection 2 Level-2 granule archives (.tar/.zip) into
  Cloud Optimized GeoTIFF disaster-response products (true color, NDVI, water
  extent, etc.) with reprojection and activation-event GeoTIFF metadata tags.
code_repository: https://github.com/Disasters-Learning-Portal/disasters-product-algorithms.git
# MAAP clones the repo to /app/<repo-name>/ and runs these from /app, so the
# command paths MUST be prefixed with the repo directory name.
build_command: disasters-product-algorithms/dps/landsat/build-env.sh
run_command: disasters-product-algorithms/dps/landsat/run.sh
# MAAP OPS default base image. MAAP installs Miniconda during the build and runs
# build-env.sh on top, so a minimal base is fine.
base_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.2.0
# Resource requirements (OGC/CWL schema; replaces the old queue + disk_space).
ram_min: 64
cores_min: 8
outdir_max: 20
# Metadata (pre-fills the registration form).
author: NASA Disasters
contributor: NASA Disasters
license: Apache-2.0
release_notes: DPS integration for Landsat 8/9 COG disaster-product generation.
citation: NASA Disasters Program
keywords: landsat, cog, disasters, flood, fire, ndvi, water-extent
# Inputs: flat list, each {name, label, doc, type, default}. File inputs are
# localized by DPS and passed to run.sh as --name <path>; booleans as a true/false
# control; primitives as --name <value>. run.sh maps these onto process_landsat89.
inputs:
  - name: file_path_of_raw_data
    label: Raw data file
    doc: A Landsat Collection 2 Level-2 granule archive (.tar or .zip).
    type: File
  - name: activation_event
    label: Activation event
    doc: "Activation event, e.g. 202511_Flood_TX. The placeholder YYYYMM_Hazard_Location is rejected at run time -- you MUST set a real value."
    type: string
    default: "YYYYMM_Hazard_Location"
  - name: products
    label: Products
    doc: Space-separated list (true pan nat colorIR ndvi ndwi mndwi evi nbr we) or 'all'.
    type: string
    default: "true"
  - name: source_label
    label: Source
    doc: "Data origin (required), e.g. USGS, NASA, NOAA."
    type: string
  - name: dst_crs
    label: Target CRS
    doc: "Target CRS: native (default, no warp, preserves source projection) | EPSG:3857 | EPSG:4326."
    type: string
    default: "native"
  - name: merge
    label: Merge by date/product
    doc: Mosaic tiles by date and product (-merge).
    type: boolean
    default: true
  - name: mask
    label: Cloud mask
    doc: Generate and apply a cloud mask (-mask).
    type: boolean
    default: true
  - name: process_date
    label: Process date (optional)
    doc: "Only process this date, YYYYMMDD; leave blank for all dates."
    type: string
    default: ""
  - name: process_tile
    label: Process tile (optional)
    doc: "Only process this path/row, e.g. 171035; leave blank for all tiles."
    type: string
    default: ""
  - name: we_nstd
    label: Water-extent std devs
    doc: 'Space-separated std-dev thresholds for water extent (only used when products includes "we").'
    type: string
    default: "1 1.5"
  - name: compression_level
    label: COG compression level
    doc: ZSTD compression level (1-22).
    type: int
    default: 22
  - name: nodata
    label: No-data value (optional)
    doc: "Override the auto-detected no-data value; leave blank to auto-detect."
    type: string
    default: ""
  - name: enable_s3_upload
    label: Publish to S3
    doc: "Upload products to s3://<s3_bucket>/<s3_dest_base>/<activation_event>/ (DPS also uploads output/ to its job bucket regardless)."
    type: boolean
    default: false
  - name: s3_bucket
    label: S3 bucket
    doc: Destination S3 bucket for published COGs.
    type: string
    default: "nasa-disasters"
  - name: s3_dest_base
    label: S3 destination base
    doc: Base prefix within the bucket; products land at <s3_dest_base>/<activation_event>/.
    type: string
    default: "drcs_activations_new"
  - name: save_png
    label: Save PNG quicklook
    doc: Also write a .png quicklook next to each product COG.
    type: boolean
    default: true
  - name: png_min
    label: PNG min (optional)
    doc: "Manual lower bound for PNG scaling; blank = auto (2nd percentile, or 0 for uint8 RGB)."
    type: string
    default: ""
  - name: png_max
    label: PNG max (optional)
    doc: "Manual upper bound for PNG scaling; blank = auto (98th percentile, or 255 for uint8 RGB)."
    type: string
    default: ""
  - name: delete_cog
    label: Delete COG from home after upload
    doc: "Delete the COG from ~/drcs_outputs after it is copied to output/ and uploaded (frees space; PNG and the output/ copy are kept)."
    type: boolean
    default: true
outputs:
  - name: output
    type: Directory
