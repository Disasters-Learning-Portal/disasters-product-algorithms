# =============================================================================
# OGC Application Package config for Capella — CLI registration path.
# =============================================================================
# This is the ogc-app-pack-generator flavor of dps/capella/algorithm_config.yaml,
# used to register via MAAP-Project/ogc-app-pack-generator (a GitHub Action / the
# OGC processes API) INSTEAD of the Register Algorithm GUI. Two deliberate
# differences from the GUI config:
#
#   1. Optional inputs carry the `?` type-suffix (boolean?/string?/int?). The
#      GUI's Type dropdown rejects `?` ("Please select an item in the list."),
#      but the CLI generator passes the type through verbatim, so `?` -> OGC
#      minOccurs:0 -> optional:true. THAT is what stops the Submit Job form's
#      "Valid value required." error on falsy-defaulted inputs (false / "").
#      (See docs/DPS.md "Two registration paths disagree on the type vocabulary".)
#
#   2. No base_container_url + build_command. We point at a PRE-BUILT image
#      (algorithm_container_url) that already bakes the `disasters_dps` env +
#      the repo (built by .github/workflows/build-dps-image.yaml). run_command is
#      therefore an ABSOLUTE path inside that image — the CWL baseCommand runs in
#      the ADES job working dir, not /app, so a relative path would not resolve.
#
# algorithm_name is intentionally distinct ("capella-ogc-test") so registering
# this does NOT overwrite an existing GUI-registered "capella" process.
# =============================================================================
algorithm_name: capella-ogc-test
algorithm_version: kyle-test
algorithm_description: >-
  Process Capella SAR scenes into Cloud Optimized GeoTIFF disaster-response
  products. Fetches the source GEO rasters from the CSDA Capella vendor S3
  bucket (keyed by date/bucket/prefix), computes the sigma-naught calibration
  product, optionally applies a Lee speckle filter, and writes a COG with
  activation-event GeoTIFF metadata tags.
code_repository: https://github.com/Disasters-Learning-Portal/disasters-product-algorithms.git

# Pre-built DPS worker image (built by .github/workflows/build-dps-image.yaml from
# the kyle-test branch). Because this is set, validate_inputs.py skips the Docker
# build and the register workflow must NOT pass a dockerfile-path. The image must
# be PUBLICLY pullable for MAAP's ADES to fetch it.
algorithm_container_url: docker.io/klesinger/disasters-dps-image:kyle-test

# Absolute path INSIDE the image (the Dockerfile bakes the repo at
# /app/disasters-product-algorithms). The CWL baseCommand runs from the ADES job
# CWD, so this must be absolute, not the GUI config's repo-relative path.
run_command: /app/disasters-product-algorithms/dps/capella/run.sh

# Resource requirements. SAR scenes are smaller than optical mosaics.
ram_min: 32
cores_min: 4
outdir_max: 20
# Metadata.
author: NASA Disasters
contributor: NASA Disasters
license: Apache-2.0
release_notes: OGC/CLI registration test — optional inputs via ? suffix + prebuilt image.
citation: NASA Disasters Program
keywords: capella, sar, sigma0, cog, disasters, flood

# INPUTS — optional/defaulted inputs carry `?` (OGC-optional). Only the genuinely
# required inputs stay bare: `date` and `source_label` (no default), and
# `activation_event` (kept required as an operator nudge; run.sh rejects the
# placeholder regardless).
inputs:
  - name: list_dates
    label: List available scene dates (report only)
    doc: >-
      Discovery / dry-run switch. Set TRUE to make this job print a REPORT of the
      Capella scenes available in the vendor bucket instead of processing anything:
      one row per scene, newest first by S3 delivery time (the top rows are the
      scenes most recently added to S3, i.e. closest to today), showing the value
      to copy into the 'date' input plus its acquisition and S3-delivery
      timestamps. The report is written to the job log; no COG is produced,
      nothing is uploaded, and date/activation_event/source_label are NOT required
      in this mode. Use it to find a valid 'date', then run again with this set
      FALSE (the default) to actually process the chosen scene.
    type: boolean?
    default: false
  - name: date
    label: Target date
    doc: "Target acquisition date, YYYYMMDDHHMMSS. The closest matching Capella scene in the vendor bucket is selected. To discover valid dates, run once with list_dates=true (prints a report of available scenes, newest first) or use: aws s3 ls s3://csdap-capellaspace-delivery/disasters/ (see docs/DPS.md 'Finding available scenes')."
    type: string
  - name: product
    label: Calibration product
    doc: "Calibration product to generate. Only 'sigma' (sigma-naught) is supported."
    type: string?
    default: "sigma"
  - name: bucket
    label: Vendor S3 bucket
    doc: CSDA Capella vendor S3 bucket to fetch source rasters from. The DPS worker must have read access.
    type: string?
    default: "csdap-capellaspace-delivery"
  - name: prefix
    label: Vendor S3 prefix
    doc: Key prefix within the vendor bucket to search for scenes.
    type: string?
    default: "disasters"
  - name: apply_filter
    label: Apply Lee filter
    doc: Apply a Lee speckle filter to the sigma0 product.
    type: boolean?
    default: false
  - name: filter_size
    label: Lee filter window size
    doc: Lee filter window size in pixels (only used when apply_filter is true).
    type: int?
    default: 5
  - name: dst_crs
    label: Target CRS
    doc: "Target CRS: native (default, no warp, preserves source UTM) | EPSG:3857 | EPSG:4326."
    type: string?
    default: "native"
  - name: activation_event
    label: Activation event
    doc: "Activation event, e.g. 202511_Flood_TX. The placeholder YYYYMM_Hazard_Location is rejected at run time -- you MUST set a real value."
    type: string
    default: "YYYYMM_Hazard_Location"
  - name: source_label
    label: Source
    doc: "Data origin (required), e.g. USGS, NASA, NOAA, Copernicus, Capella Space."
    type: string
  - name: compression_level
    label: COG compression level
    doc: "ZSTD level 1-22. Lower = faster but larger files; higher = slower but smaller. ~1 fast, low compression; ~12 balanced; 22 max compression (default)."
    type: int?
    default: 22
  - name: nodata
    label: No-data value (optional)
    doc: "Override the auto-detected no-data value; leave blank to auto-detect."
    type: string?
    default: ""
  - name: enable_s3_upload
    label: Publish to S3
    doc: "Upload products to s3://nasa-disasters/drcs_activations_new/<activation_event>/ (locked destination, not operator-editable; DPS also uploads output/ to its job bucket regardless)."
    type: boolean?
    default: false
  - name: save_png
    label: Save PNG quicklook
    doc: Also write a .png quicklook next to each product COG.
    type: boolean?
    default: true
  - name: png_min
    label: PNG min (optional)
    doc: "Manual lower bound for PNG scaling; blank = auto (2nd percentile, or 0 for uint8 RGB)."
    type: string?
    default: ""
  - name: png_max
    label: PNG max (optional)
    doc: "Manual upper bound for PNG scaling; blank = auto (98th percentile, or 255 for uint8 RGB)."
    type: string?
    default: ""
  - name: delete_cog
    label: Delete COG from home after upload
    doc: "Delete the COG from ~/drcs_outputs after it is copied to output/ and uploaded (frees space; PNG and the output/ copy are kept)."
    type: boolean?
    default: true
outputs:
  - name: output
    type: Directory
