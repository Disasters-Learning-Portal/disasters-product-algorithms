# =============================================================================
# OGC Application Package config for Capella — CLI/GitHub-Action registration.
# =============================================================================
# Registered via MAAP-Project/ogc-app-pack-generator (.github/workflows/register-dps.yml)
# instead of the Register Algorithm GUI. Two things this buys us over the GUI:
#
#   1. EVERY input is OGC-optional (the `?` type-suffix -> minOccurs:0). The GUI
#      cannot express optional (its Type dropdown rejects `?`), so on a
#      GUI-registered algorithm the Submit Job form errors "Valid value required"
#      on any falsy value (a toggle left off, a blank box). Here nothing blocks
#      Submit — you can submit with the defaults untouched. run.sh remains the
#      real enforcement point (it rejects a missing date, blank source, and the
#      placeholder activation_event). See docs/DPS.md.
#
#   2. No prebuilt image to maintain. register-dps.yml passes `dockerfile-path:
#      dps/Dockerfile`, so the Action BUILDS the DPS worker image from the branch
#      it runs on and pushes it to ghcr.io, then injects that image into the
#      generated CWL. There is therefore NO algorithm_container_url field here.
#      `run_command` is an ABSOLUTE path inside that image (the Dockerfile bakes
#      the repo at /app/disasters-product-algorithms); the CWL baseCommand runs
#      from the ADES job CWD, so a repo-relative path would not resolve.
#
# algorithm_name is intentionally distinct ("capella-ogc-test") so registering
# this does NOT overwrite the existing GUI-registered "capella" process.
# =============================================================================
algorithm_name: capella-ogc-test
algorithm_version: dev
algorithm_description: >-
  Process Capella SAR scenes into Cloud Optimized GeoTIFF disaster-response
  products (sigma-naught, optional Lee filter). Fetches source rasters from the
  CSDA Capella vendor S3 bucket keyed by date. OGC test build: every input is
  optional in the schema so the Submit form never blocks; run.sh enforces the
  real requirements (date, source, non-placeholder activation_event).
keywords: capella, sar, sigma0, cog, disasters, flood
code_repository: https://github.com/Disasters-Learning-Portal/disasters-product-algorithms.git
citation: NASA Disasters Program
author: NASA Disasters
contributor: NASA Disasters
license: Apache-2.0
release_notes: OGC registration test — all inputs optional (no "Valid value required") + image built in-workflow from dps/Dockerfile.
# Absolute path INSIDE the built image (Dockerfile bakes the repo at
# /app/disasters-product-algorithms). Not repo-relative.
run_command: /app/disasters-product-algorithms/dps/capella/run.sh
ram_min: 32
cores_min: 4
outdir_max: 20

# INPUTS — ALL optional (`?`), so no falsy value can trip the Submit form's
# "Valid value required" check. Defaults mirror dps/capella/run.sh; run.sh does
# the real validation after parsing.
inputs:
  - name: date
    label: Target date
    doc: "Target acquisition date, YYYYMMDDHHMMSS. Closest matching Capella scene is selected. Discover valid dates via the 'list-dates' algorithm (sensor=capella). REQUIRED for a real run (run.sh rejects an empty date)."
    type: string?
    default: ""
  - name: product
    label: Calibration product
    doc: "Calibration product to generate. Only 'sigma' (sigma-naught) is supported."
    type: string?
    default: "sigma"
  - name: bucket
    label: Vendor S3 bucket
    doc: CSDA Capella vendor S3 bucket to fetch source rasters from (DPS worker needs read access).
    type: string?
    default: "csdap-capellaspace-delivery"
  - name: prefix
    label: Vendor S3 prefix
    doc: Key prefix within the vendor bucket to search for scenes.
    type: string?
    default: "disasters"
  - name: apply_filter
    label: Apply Lee filter
    doc: Apply a Lee speckle filter to the sigma0 product.
    type: boolean?
    default: false
  - name: filter_size
    label: Lee filter window size
    doc: Lee filter window size in pixels (only used when apply_filter is true).
    type: int?
    default: 5
  - name: dst_crs
    label: Target CRS
    doc: "Target CRS: native (default, no warp, preserves source UTM) | EPSG:3857 | EPSG:4326."
    type: string?
    default: "native"
  - name: activation_event
    label: Activation event
    doc: "Activation event, e.g. 202511_Flood_TX. The placeholder YYYYMM_Hazard_Location is REJECTED at run time -- set a real value for a real run."
    type: string?
    default: "YYYYMM_Hazard_Location"
  - name: source_label
    label: Source
    doc: "Data origin, e.g. USGS, NASA, NOAA, Capella Space. REQUIRED for a real run (run.sh rejects an empty source)."
    type: string?
    default: ""
  - name: compression_level
    label: COG compression level
    doc: "ZSTD level 1-22. Lower = faster/larger; higher = slower/smaller. 22 = max (default)."
    type: int?
    default: 22
  - name: nodata
    label: No-data value (optional)
    doc: "Override the auto-detected no-data value; leave blank to auto-detect."
    type: string?
    default: ""
outputs:
  - name: output
    type: Directory
