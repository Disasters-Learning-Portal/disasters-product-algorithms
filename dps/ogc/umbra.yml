# =============================================================================
# OGC Application Package config for Umbra — registered via the GitHub Action
# (.github/workflows/register-dps.yml → MAAP ogc-app-pack-generator).
# EVERY input is OGC-optional (`?` → minOccurs:0) so the Submit form never blocks
# ("Valid value required"); run.sh stays the real validator. No container field:
# the Action builds the image from dps/Dockerfile (dockerfile-path) and injects
# it, so run_command is an ABSOLUTE path inside that image.
# =============================================================================
# algorithm_name: like sentinel2/blackmarble, umbra does NOT use a
# "<sensor>-ogc-test" name — this is the canonical registration, and
# dps/umbra/algorithm_config.yaml (the GUI path) carries the SAME name on
# purpose. NOTE: a rename registers a NEW process; the older "umbra-ogc-test"
# and GUI-registered "umbra" are NOT renamed and must be deleted in MAAP by hand.
algorithm_name: disasters-umbra-process
algorithm_version: dev
algorithm_description: >-
  Process Umbra SAR scenes into Cloud Optimized GeoTIFF disaster-response
  products (sigma/beta/gamma calibration, always-on Lee speckle filter with a
  selectable 3/5/7 window). Fetches the source GEC raster from the CSDA Umbra
  vendor S3 bucket keyed by date. Every input is optional in the schema so the
  Submit form never blocks; run.sh enforces the real requirements.
keywords: umbra, sar, cog, disasters, flood, calibration
code_repository: https://github.com/Disasters-Learning-Portal/disasters-product-algorithms.git
citation: NASA Disasters Program
author: NASA Disasters
contributor: NASA Disasters
license: Apache-2.0
release_notes: OGC registration — all inputs optional; image built in-workflow from dps/Dockerfile.
run_command: /app/disasters-product-algorithms/dps/umbra/run.sh
ram_min: 32
cores_min: 4
outdir_max: 20

inputs:
  - name: date
    label: Target date
    doc: "Target acquisition date 'YYYY-MM-DD HH:MM:SS'. REQUIRED for a real run (run.sh rejects an empty date). Discover valid dates with the list-dates algorithm (sensor=umbra)."
    type: string?
    default: ""
  - name: product
    label: Calibration product
    doc: "Calibration product to generate: sigma, beta, gamma, or rcs."
    type: string?
    default: "sigma"
  - name: bucket
    label: Vendor S3 bucket
    doc: CSDA Umbra vendor S3 bucket (DPS worker needs read access).
    type: string?
    default: "csda-data-vendor-umbra"
  - name: prefix
    label: S3 prefix
    doc: Key prefix within the vendor bucket to search for scenes.
    type: string?
    default: "disasters"
  - name: apply_filter
    label: Apply Lee filter
    doc: Apply a Lee speckle filter to the product.
    type: boolean?
    default: false
  - name: filter_size
    label: Lee filter window size
    doc: Lee filter window size (only used when apply_filter is true).
    type: int?
    default: 5
  - name: dst_crs
    label: Target CRS
    doc: "Target CRS: native (default) | EPSG:3857 | EPSG:4326."
    type: string?
    default: "native"
  - name: activation_event
    label: Activation event
    doc: "Activation event, e.g. 202511_Flood_TX. The placeholder YYYYMM_Hazard_Location is REJECTED at run time."
    type: string?
    default: "YYYYMM_Hazard_Location"
  - name: source_label
    label: Source
    doc: "Data origin, e.g. USGS, NASA, NOAA, Umbra. REQUIRED for a real run."
    type: string?
    default: ""
  - name: compression_level
    label: COG compression level
    doc: "ZSTD level 1-22 (22 = max, default)."
    type: int?
    default: 22
  - name: nodata
    label: No-data value (optional)
    doc: "Override the auto-detected no-data value; leave blank to auto-detect."
    type: string?
    default: ""
outputs:
  - name: output
    type: Directory
