algorithm_name: sentinel-2
# git ref DPS clones (branch or tag). 'dev' tracks active development; pin a tag
# (e.g. v0.10.0) for reproducible production runs.
algorithm_version: dev
algorithm_description: >-
  Download Sentinel-2 L2A/L1C scenes from the Copernicus Data Space (CDSE) by
  MGRS tile(s) + date, then process into Cloud Optimized GeoTIFF disaster-response
  products (true color, SWIR, NDVI, water extent, etc.) with reprojection and
  activation-event GeoTIFF metadata tags. Copernicus credentials are read from
  MAAP secrets (COP_USER / COP_PASS) at run time -- they are NOT job inputs, so
  they never appear in the job parameters or log.
code_repository: https://github.com/Disasters-Learning-Portal/disasters-product-algorithms.git
# MAAP clones the repo to /app/<repo-name>/ and runs these from /app, so the
# command paths MUST be prefixed with the repo directory name.
build_command: disasters-product-algorithms/dps/sentinel2/build-env.sh
run_command: disasters-product-algorithms/dps/sentinel2/run.sh
# MAAP OPS default base image. MAAP installs Miniconda during the build and runs
# build-env.sh on top, so a minimal base is fine.
base_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.2.0
# Resource requirements (OGC/CWL schema; replaces the old queue + disk_space).
ram_min: 64
cores_min: 8
outdir_max: 20
# Metadata (pre-fills the registration form).
author: NASA Disasters
contributor: NASA Disasters
license: Apache-2.0
release_notes: DPS integration for Sentinel-2 COG disaster-product generation.
citation: NASA Disasters Program
keywords: sentinel-2, cog, disasters, flood, fire, ndvi, water-extent
# Inputs: flat list, each {name, label, doc, type, default}. Booleans arrive as a
# true/false control; primitives as --name <value>. run.sh downloads the requested
# scenes from Copernicus, then maps these onto process_sentinel2. Copernicus
# credentials are NOT inputs here and NOT secret-name inputs either -- run.sh pulls
# them from MAAP secrets by the fixed names COP_USER / COP_PASS at run time (store
# them once with maap.secrets.add_secret; see docs/DPS.md).
inputs:
  - name: tile
    label: MGRS tile(s)
    doc: 'Sentinel-2 MGRS tile ID(s) to download, e.g. T17RLN (space-separated for several, no quotes: T17RLN T17RLM). Pre-filled with a known-good test tile; change it for a real activation.'
    type: string
    default: "T17RLN T17RLM"
  - name: activation_event
    label: Activation event
    doc: "Activation event, e.g. 202511_Flood_TX. Pre-filled with a test value so a bare Submit runs; set a REAL event for a real activation (the placeholder YYYYMM_Hazard_Location is rejected at run time)."
    type: string
    default: "202601_KyleWx_US"
  - name: download_date
    label: Download date (optional)
    doc: "Acquisition date to download: one YYYYMMDD, or a start end pair (space-separated). Blank = the CLI's recent-scenes default (~past 10 days). Pre-filled with a known-good test date."
    type: string
    default: "20251231"
  - name: level
    label: Processing level
    doc: "Sentinel-2 processing level to download: 2 = L2A (surface reflectance), 1 = L1C (top-of-atmosphere). Default 1 for the fast test path; use 2 for atmospherically-corrected production."
    type: string
    default: "1"
  - name: limit
    label: Search result limit
    doc: "Maximum number of Copernicus search results to download for the tile/date."
    type: int
    default: 50
  - name: products
    label: Products
    doc: Space-separated list (true nat swir colorIR ndvi ndwi mndwi nbr we) or 'all'.
    type: string
    default: "true swir"
  - name: source_label
    label: Source
    doc: "Data origin (required), e.g. Copernicus, ESA."
    type: string
    default: "Copernicus"
  - name: dst_crs
    label: Target CRS
    doc: "Target CRS: native (default, no warp, preserves source projection) | EPSG:3857 | EPSG:4326."
    type: string
    default: "native"
  - name: merge
    label: Merge by date/product
    doc: Mosaic scenes by date and product (-merge).
    type: boolean
    default: true
  - name: mask
    label: Cloud mask
    doc: Generate and apply a cloud mask (-mask, L2A only).
    type: boolean
    default: false
  - name: we_nstd
    label: Water-extent std devs (optional)
    doc: 'Space-separated std-dev thresholds for water extent (no quotes), e.g. 1 1.5.'
    type: string
    default: ""
  - name: compression_level
    label: COG compression level
    doc: "ZSTD level 1-22. Lower = faster but larger files; higher = slower but smaller. Default 1 for a fast test; raise (~12 balanced, 22 max) for smaller production COGs."
    type: int
    default: 1
  - name: nodata
    label: No-data value
    doc: "No-data value for the output COGs (Sentinel-2 default 0)."
    type: string
    default: "0"
  - name: enable_s3_upload
    label: Publish to S3
    doc: "Upload products to s3://nasa-disasters/drcs_activations_new/<activation_event>/ (locked destination, not operator-editable; DPS also uploads output/ to its job bucket regardless). ON by default."
    type: boolean
    default: true
  - name: save_png
    label: Save PNG quicklook
    doc: Also write a .png quicklook next to each product COG.
    type: boolean
    default: true
  - name: png_min
    label: PNG min (optional)
    doc: "Manual lower bound for PNG scaling; blank = auto (2nd percentile, or 0 for uint8 RGB)."
    type: string
    default: ""
  - name: png_max
    label: PNG max (optional)
    doc: "Manual upper bound for PNG scaling; blank = auto (98th percentile, or 255 for uint8 RGB)."
    type: string
    default: ""
  - name: delete_cog
    label: Delete COG from home after upload
    doc: "Delete the COG from ~/drcs_outputs after it is copied to output/ and uploaded (frees space; PNG and the output/ copy are kept)."
    type: boolean
    default: true
outputs:
  - name: output
    type: Directory
