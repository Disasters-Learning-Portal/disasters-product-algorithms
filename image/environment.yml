channels:
  - conda-forge
  - nodefaults
dependencies:
  - ipykernel
  # Dependencies for sentintel-2 scripts
  - p7zip==16.02
  # JPEG2000 (.jp2) driver for Sentinel-2. UNPINNED on purpose: it is ABI-locked
  # to the base image's libgdal-core, so let conda match whatever GDAL the base
  # ships. An exact pin (==3.10.3) is what broke the 2025.08.14 -> 2026.06.04
  # base bump (base shipped GDAL 3.12.3); staying unpinned matters even more now
  # that the base is the MAAP image (different GDAL lineage). Do not re-pin.
  - libgdal-jp2openjpeg
  # Dependencies for VS Code IDE
  - code-server>=3.2
  - jupyter-vscode-proxy
  - openssh
  - pre_commit
  # Remove once Pangeo has upstream.
  - virtualizarr>=2.0.0
  - icechunk
  # geoviews PR #794 (Cartopy 0.25 compat) shipped in 1.14.1; floor keeps the fix
  # and lets the solver pick a Python-3.13-compatible build.
  - geoviews-core>=1.14.1
  # pystac issue #1575 fixed in 1.14.0; floor keeps the fix, drops the exact pin.
  - pystac>=1.14.0
  # Required by tools/new_sensor.py at runtime. nbformat is part of Jupyter
  # so usually already in Pangeo base, but listing both explicitly here
  # guarantees the scaffolder runs on a fresh hub pod without a manual
  # `pip install tomlkit nbformat` step.
  - tomlkit
  - nbformat
  # COG preview in the operator notebooks. The sensor workflows end with a
  # leafmap map of the finished COG, served locally by localtileserver. These
  # were previously `! pip install leafmap` / `! pip install localtileserver`
  # cells inside capella_workflow.ipynb, which re-ran on every kernel start and
  # installed into the running env rather than the image. Both are conda-forge
  # packages, so they belong here (see the dependency table in CLAUDE.md:
  # conda-only + needed in the hub image -> image/environment.yml).
  - leafmap
  - localtileserver
  # Add new conda-only packages here. Pre-consolidation, packages ON TOP of
  # Pangeo base were tracked in `hub-conda-deps.txt` at the algorithms repo
  # root + auto-synced into a managed block in this file via the
  # `sync-conda-deps.yml` workflow. Both are gone after the image-repo
  # consolidation — this file is now the single source of truth for
  # hub-image conda deps. The MAAP base image
  # (mas.maap-project.org/root/maap-workspaces/2i2c/pangeo:<tag>, a NASA-VEDA /
  # pangeo derivative) provides GDAL, rasterio, rio-cogeo, geopandas, pyproj,
  # numpy, scipy, boto3, etc. — plus maap-py and the MAAP JupyterLab extensions
  # — so most things don't need a line here.
  - pip
  - pip:
    - git+https://github.com/MAAP-Project/stac_ipyleaflet.git@0.3.6
    - jupyter-sshd-proxy
    # jupyterlab-bxplorer (S3 data browser) was REMOVED 2026-08-11 and must not
    # be re-added until upstream scopes its CSS. It imports Bootstrap 5's full
    # dist stylesheet UNSCOPED into JupyterLab's global stylesheet
    # (style/index.css `@import '../node_modules/bootstrap/dist/css/bootstrap.min.css'`
    # plus the same import in src/components/DownloadComponent.tsx), and the
    # bundle is pulled into the extension's initial load graph via remoteEntry,
    # so it is injected into document.head at Lab startup on every page load.
    # Bootstrap's Reboot then wins the cascade on bare `*` and `body` selectors
    # -- `body{font-size:1rem;line-height:1.5}` overrides Lab's 13px
    # --jp-ui-font-size1 -- restyling the whole application.
    # NOTE: this is NOT the cause of the "chevron icons everywhere" bug
    # (2i2c-org/infrastructure#8770). That one is the MAAP DPS/Algorithms
    # extensions' `overflow: scroll !important`, and they are inherited from
    # the MAAP base image, so they cannot be removed from this file -- see
    # docs/HUB_EXTENSIONS.md. The bxplorer removal stands on its own merits.
    # Full rationale: .clinerules.md rule 39.
    # maap-py + the MAAP DPS JupyterLab extensions are NO LONGER pinned here.
    # The MAAP base image (mas.maap-project.org/root/maap-workspaces/2i2c/pangeo)
    # already ships maap-py (`from maap.maap import MAAP` works out of the box)
    # AND the "MAAP Plugins" Launcher tiles (Algorithm Catalog / Register
    # Algorithms / My Builds & Deployments / Submit Jobs / View My Jobs). We
    # inherit MAAP's maintained versions instead of hand-pinning a stale one --
    # re-adding `maap-py==<old>` here would DOWNGRADE the base's client, which is
    # exactly the staleness the base swap removed. maap-py stays out of pyproject
    # [project.dependencies] too (the algorithms package + DPS workers never
    # import it). If MAAP ops ever requires a newer client than the base ships,
    # bump the base image tag in image/Dockerfile rather than re-pinning here.
    # disasters-product-algorithms is intentionally NOT installed here. It's
    # installed in a separate Dockerfile RUN layer via
    # `pip install --no-deps /srv/repo/algorithms`, which uses the local
    # checkout (the algorithms repo IS the build context post-consolidation).
    # See image/Dockerfile.
variables:
  TITILER_STAC_ENDPOINT: 'https://openveda.cloud/api/stac'
  TITILER_ENDPOINT: 'https://openveda.cloud/api/raster'
  STAC_CATALOG_NAME: 'VEDA STAC'
  STAC_CATALOG_URL: 'https://openveda.cloud/api/stac'
  STAC_BROWSER_URL: 'https://openveda.cloud/'
